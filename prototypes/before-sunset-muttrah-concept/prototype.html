<!-- Question: Can a first-time player notice a subtle in-world clue while chased, and does a miss feel fair (not random)? -->
<!-- Date: 2026-11-03 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Before Sunset: Muttrah - concept prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #120d0b; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    display: block;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
// PROTOTYPE - NOT FOR PRODUCTION
// Question: Can a first-time player notice a subtle in-world clue while chased, and does a miss feel fair (not random)?
// Date: 2026-11-03
//
// Rule of the world (never stated in the game): an ORANGE chalk X painted on the wall
// beside a street means that street is trapped just ahead. Every other colour is decoration.
// Fork 1 clue is big and obvious. Fork 2 clue is small and sits among decoys.

const W = 960, H = 540;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- tuning (hardcoded on purpose) ----------
const PLAYER_V = 120;      // px/s
const PR = 8;              // player radius
const CAT_V0 = 62;         // cat speed at t=0 (px/s)
const CAT_ACC = 2.3;       // cat speed gain per second
const HEAD_START = 170;    // trail px between cats and player at start
const CATCH_R = 16;
const SUN_T = 40;          // seconds until sunset (fallback loss)
const START = { x: 70, y: 470 };
const GOAL = { x: 870, y: 68, r: 24 };

// ---------- world ----------
// Two rings of street. Each ring is a fork: one safe street, one trapped street.
const STREETS = [
  [30, 440, 290, 60],  // start street
  [240, 300, 60, 200], // ring 1 left connector
  [270, 440, 350, 60], // ring 1 lower street  (TRAPPED)
  [240, 300, 380, 60], // ring 1 upper street  (safe)
  [560, 300, 60, 200], // ring 1 right connector
  [560, 130, 60, 200], // link to ring 2
  [560, 140, 340, 60], // ring 2 lower street  (safe)
  [560, 40, 60, 160],  // ring 2 left connector
  [560, 40, 340, 60],  // ring 2 upper street  (TRAPPED)
  [840, 40, 60, 160]   // ring 2 right connector
];
const TRAPS = [
  { id: 1, rect: [400, 440, 70, 60], name: 'Falling crates' },
  { id: 2, rect: [680, 40, 70, 60], name: 'Open drain' }
];
const FORKS = [
  { safe: 'upper', test: (x, y) => (x >= 380 && x <= 520) ? (y >= 440 ? 'lower' : (y <= 360 ? 'upper' : null)) : null },
  { safe: 'lower', test: (x, y) => (x >= 660 && x <= 780) ? (y >= 140 ? 'lower' : (y <= 100 ? 'upper' : null)) : null }
];

function walkable(x, y) {
  for (const s of STREETS) {
    if (x >= s[0] + PR && x <= s[0] + s[2] - PR && y >= s[1] + PR && y <= s[1] + s[3] - PR) return true;
  }
  return false;
}

// ---------- state ----------
let state = 'ready';       // ready | run | over
let t = 0, res = null, trapHit = null, shake = 0;
let px, py, xs, ys, ds, sc;
let attemptN = 0, cur = null;
const attempts = [];

function reset() {
  px = START.x; py = START.y;
  xs = []; ys = []; ds = [];
  for (let i = 0; i <= HEAD_START / 10; i++) { xs.push(START.x - HEAD_START + i * 10); ys.push(START.y); ds.push(i * 10); }
  sc = 0; t = 0; state = 'ready'; res = null; trapHit = null; shake = 0;
  cur = { n: attemptN + 1, f: [null, null], res: '', t: 0, trap: '' };
}

function posAt(s) {
  const L = ds[ds.length - 1];
  if (s <= 0) return [xs[0], ys[0]];
  if (s >= L) return [xs[xs.length - 1], ys[ys.length - 1]];
  let lo = 0, hi = ds.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ds[m] <= s) lo = m; else hi = m; }
  const f = (s - ds[lo]) / ((ds[hi] - ds[lo]) || 1);
  return [xs[lo] + (xs[hi] - xs[lo]) * f, ys[lo] + (ys[hi] - ys[lo]) * f];
}

function pushTrail() {
  const i = xs.length - 1;
  const d = Math.hypot(px - xs[i], py - ys[i]);
  if (d >= 3) { xs.push(px); ys.push(py); ds.push(ds[i] + d); }
}

function endRun(r, trapName) {
  state = 'over'; res = r;
  cur.res = r; cur.t = t; cur.trap = trapName || '';
  attemptN++; attempts.push(cur);
  if (r === 'trapped') shake = 0.4;
}

// ---------- input ----------
const keys = {};
const pointer = { down: false, x: 0, y: 0 };
window.__bot = null; // test hook: array of [x,y] waypoints or {wait:seconds}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (k === 'r') reset();
  else if (state === 'over' && (k === ' ' || k === 'enter')) reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function setPointer(e) {
  const r = cv.getBoundingClientRect();
  pointer.x = (e.clientX - r.left) * W / r.width;
  pointer.y = (e.clientY - r.top) * H / r.height;
}
cv.addEventListener('pointerdown', e => {
  setPointer(e);
  if (state === 'over') { reset(); pointer.down = false; return; }
  pointer.down = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => { setPointer(e); });
cv.addEventListener('pointerup', () => { pointer.down = false; });
cv.addEventListener('pointercancel', () => { pointer.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

function readInput(dt) {
  let dx = 0, dy = 0;
  const bot = window.__bot;
  if (bot && bot.length) {
    const w = bot[0];
    if (w.wait !== undefined) { w.wait -= dt; if (w.wait <= 0) bot.shift(); }
    else {
      const vx = w[0] - px, vy = w[1] - py, d = Math.hypot(vx, vy);
      if (d < 5) bot.shift(); else { dx = vx / d; dy = vy / d; }
    }
    return [dx, dy];
  }
  if (pointer.down) {
    const vx = pointer.x - px, vy = pointer.y - py, d = Math.hypot(vx, vy);
    if (d > 6) { dx = vx / d; dy = vy / d; }
    return [dx, dy];
  }
  if (keys['arrowleft'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup'] || keys['w']) dy -= 1;
  if (keys['arrowdown'] || keys['s']) dy += 1;
  const m = Math.hypot(dx, dy);
  if (m > 0) { dx /= m; dy /= m; }
  return [dx, dy];
}

// ---------- update ----------
function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (state === 'over') { readInput(dt); return; }
  const [dx, dy] = readInput(dt);
  if (state === 'ready') { if (dx || dy) state = 'run'; else return; }

  t += dt;
  const nx = px + dx * PLAYER_V * dt, ny = py + dy * PLAYER_V * dt;
  if (walkable(nx, ny)) { px = nx; py = ny; }
  else if (walkable(nx, py)) px = nx;
  else if (walkable(px, ny)) py = ny;
  pushTrail();

  // cats follow the player's own trail
  sc += (CAT_V0 + CAT_ACC * t) * dt;
  const L = ds[ds.length - 1];
  if (sc > L) sc = L;

  // which street did the player choose at each fork?
  for (let i = 0; i < FORKS.length; i++) {
    if (cur.f[i] === null) { const r = FORKS[i].test(px, py); if (r) cur.f[i] = r; }
  }
  // traps
  for (const tr of TRAPS) {
    const r = tr.rect;
    if (px >= r[0] && px <= r[0] + r[2] && py >= r[1] && py <= r[1] + r[3]) { trapHit = tr.id; endRun('trapped', tr.name); return; }
  }
  // goal
  if (Math.hypot(px - GOAL.x, py - GOAL.y) < GOAL.r) { endRun('won'); return; }
  // cats
  const cp = posAt(sc);
  if (Math.hypot(px - cp[0], py - cp[1]) < CATCH_R || sc >= L - 1) { endRun('caught'); return; }
  // sunset
  if (t >= SUN_T) { endRun('sunset'); return; }
}

// ---------- drawing ----------
function block(x, y, w, h) {
  ctx.fillStyle = '#6c4636'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#85594a'; ctx.fillRect(x, y, w, 4);
  for (let wy = y + 12; wy < y + h - 12; wy += 22) {
    for (let wx = x + 12; wx < x + w - 14; wx += 26) {
      ctx.fillStyle = ((wx * 7 + wy * 13) % 5 === 0) ? '#e8b35a' : '#2a1a14';
      ctx.fillRect(wx, wy, 10, 12);
    }
  }
}
function awning(x, faceY, w, color, dir) {
  const y = dir < 0 ? faceY - 9 : faceY;
  ctx.fillStyle = color; ctx.fillRect(x, y, w, 9);
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  for (let i = 0; i < w; i += 10) ctx.fillRect(x + i, y, 5, 9);
}
function car(x, y, w, h, color) {
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x - w / 2 + 2, y - h / 2 + 3, w, h);
  ctx.fillStyle = color; ctx.fillRect(x - w / 2, y - h / 2, w, h);
  ctx.fillStyle = 'rgba(20,30,40,.7)';
  if (w >= h) ctx.fillRect(x - w / 6, y - h / 2 + 2, w / 3, h - 4);
  else ctx.fillRect(x - w / 2 + 2, y - h / 6, w - 4, h / 3);
}
function chalkX(cx, cy, r, lw, color) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r); ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r); ctx.stroke();
}
function chalkO(cx, cy, r, lw, color) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
}
function chalkLine(x1, y1, x2, y2, lw, color) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function scribble(x, y, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x + 6, y - 6); ctx.lineTo(x + 12, y + 3); ctx.lineTo(x + 18, y - 5); ctx.lineTo(x + 24, y + 4); ctx.stroke();
}

function drawWorld() {
  ctx.fillStyle = '#3b2620'; ctx.fillRect(0, 0, W, H);
  // sea (Muttrah corniche)
  ctx.fillStyle = '#2b5a73'; ctx.fillRect(0, 512, W, 28);
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 526); ctx.quadraticCurveTo(x + 10, 520, x + 20, 526); ctx.quadraticCurveTo(x + 30, 532, x + 40, 526); ctx.stroke(); }
  // outer buildings
  block(0, 0, 230, 420); block(240, 20, 300, 250); block(630, 210, 330, 220); block(630, 440, 330, 60);
  // the Fort (sandstone), top right
  ctx.fillStyle = '#b08a56'; ctx.fillRect(908, 20, 46, 190);
  ctx.fillStyle = '#c9a36a'; for (let y = 20; y < 210; y += 16) ctx.fillRect(908, y, 14, 8);
  ctx.fillStyle = '#7a5a34'; ctx.fillRect(922, 60, 12, 24);
  // streets
  ctx.fillStyle = '#d2ac72';
  for (const s of STREETS) ctx.fillRect(s[0], s[1], s[2], s[3]);
  // interior blocks
  block(300, 360, 260, 80); block(620, 100, 220, 40);
  // awnings (never orange)
  awning(320, 360, 40, '#3f8f8f', -1); awning(380, 360, 40, '#e8dcc0', -1); awning(470, 360, 40, '#6a5acd', -1);
  awning(430, 440, 40, '#3f8f8f', 1); awning(500, 440, 40, '#e8dcc0', 1);
  awning(640, 100, 36, '#3f8f8f', -1); awning(780, 100, 36, '#6a5acd', -1);
  awning(630, 140, 36, '#e8dcc0', 1); awning(700, 140, 36, '#3f8f8f', 1); awning(790, 140, 40, '#6a5acd', 1);
  // decoy chalk marks (never orange)
  chalkO(480, 385, 7, 2.5, '#5aa0e6'); chalkLine(410, 420, 428, 418, 3, '#6fcf7f'); scribble(520, 402, '#f2f2f2');
  chalkO(655, 122, 6, 2.2, '#5aa0e6'); chalkLine(748, 112, 764, 113, 2.5, '#6fcf7f');
  scribble(800, 126, '#f2f2f2'); chalkX(762, 124, 5, 2, '#5aa0e6');
  // CLUE 1 (obvious): big orange X on the wall beside the lower street, just before the trap
  chalkX(345, 418, 18, 6, '#ff7a1a');
  // CLUE 2 (subtle): small orange x on the wall beside the upper street, just before the trap
  chalkX(706, 114, 6, 2.5, '#f07a22');
  // cars (decor)
  car(170, 478, 36, 18, '#e8dcc0'); car(530, 474, 34, 17, '#3c6ea5'); car(590, 400, 17, 34, '#a05a5a'); car(820, 178, 34, 17, '#5b8a72');
  // labels
  ctx.fillStyle = 'rgba(60,40,25,.8)'; ctx.font = 'bold 12px system-ui,sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('START', 36, 456);
  // trap aftermath
  if (state === 'over' && res === 'trapped') {
    const r = TRAPS.find(x => x.id === trapHit).rect;
    if (trapHit === 1) {
      ctx.fillStyle = '#8a5a2b';
      for (let i = 0; i < 6; i++) ctx.fillRect(r[0] + 6 + (i % 3) * 20, r[1] + 8 + Math.floor(i / 3) * 22 + (i % 2) * 3, 18, 18);
    } else {
      ctx.fillStyle = '#1b1411'; ctx.fillRect(r[0] + 8, r[1] + 10, r[2] - 16, r[3] - 20);
      ctx.strokeStyle = '#5d5148'; ctx.lineWidth = 2;
      for (let x = r[0] + 14; x < r[0] + r[2] - 10; x += 10) { ctx.beginPath(); ctx.moveTo(x, r[1] + 10); ctx.lineTo(x, r[1] + r[3] - 10); ctx.stroke(); }
    }
  }
}

// the Fort gate (goal) is drawn on top of the dusk so the player can always find it
function drawGate() {
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300);
  ctx.fillStyle = 'rgba(255,214,120,' + (0.35 + 0.25 * pulse) + ')';
  ctx.beginPath(); ctx.arc(GOAL.x, GOAL.y, GOAL.r, 0, 7); ctx.fill();
  ctx.fillStyle = '#b08a56'; ctx.fillRect(GOAL.x - 14, GOAL.y - 14, 28, 24);
  ctx.fillStyle = '#c9a36a'; for (let i = 0; i < 4; i++) ctx.fillRect(GOAL.x - 14 + i * 8, GOAL.y - 19, 5, 6);
  ctx.fillStyle = '#4a2f1a'; ctx.fillRect(GOAL.x - 4, GOAL.y - 2, 8, 12);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText('FORT', GOAL.x, GOAL.y + 28);
}
function drawCatBodies() {
  for (let i = 0; i < 3; i++) {
    const s = Math.max(0, sc - i * 14);
    const a = posAt(s), b = posAt(s + 6);
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    ctx.save(); ctx.translate(a[0], a[1]); ctx.rotate(ang);
    ctx.fillStyle = '#100c0a';
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8, 0, 4.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(9, -3); ctx.lineTo(7, -8); ctx.lineTo(12, -4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(9, 3); ctx.lineTo(7, 8); ctx.lineTo(12, 4); ctx.fill();
    ctx.restore();
  }
}
function drawCatEyes() {
  for (let i = 0; i < 3; i++) {
    const s = Math.max(0, sc - i * 14);
    const a = posAt(s), b = posAt(s + 6);
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    ctx.save(); ctx.translate(a[0], a[1]); ctx.rotate(ang);
    ctx.fillStyle = '#d6ff5a'; ctx.shadowColor = '#d6ff5a'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(10, -2, 1.6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(10, 2, 1.6, 0, 7); ctx.fill();
    ctx.restore();
  }
}
function drawPlayer() {
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(px + 1, py + 4, 8, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#f4efe4'; ctx.beginPath(); ctx.arc(px, py, PR, 0, 7); ctx.fill();
  ctx.fillStyle = '#2f6f8f'; ctx.beginPath(); ctx.arc(px, py - 1, 5, Math.PI, 0); ctx.fill();
}
function drawDusk() {
  const k = Math.min(1, t / 30);
  ctx.fillStyle = 'rgba(70,25,95,' + (0.08 + 0.30 * k) + ')'; ctx.fillRect(0, 0, W, H);
  const r0 = 70 - 10 * k, r1 = 210 - 70 * k;
  const g = ctx.createRadialGradient(px, py, r0, px, py, r1);
  const a = 0.70 + 0.15 * k; // outside the light the world is dark: details need to be looked for
  g.addColorStop(0, 'rgba(8,10,30,0)'); g.addColorStop(1, 'rgba(8,10,30,' + a + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawHud() {
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui,sans-serif';
  ctx.fillText('Attempt ' + cur.n, 16, 24);
  const frac = Math.max(0, 1 - t / SUN_T);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(16, 32, 220, 8);
  ctx.fillStyle = frac > 0.4 ? '#ffb347' : '#b06cd6'; ctx.fillRect(16, 32, 220 * frac, 8);
  ctx.fillStyle = '#fff'; ctx.font = '11px system-ui,sans-serif'; ctx.fillText('sunset', 16, 54);
}
function panel(x, y, w, h) { ctx.fillStyle = 'rgba(10,8,12,.82)'; ctx.fillRect(x, y, w, h); }
function drawReady() {
  panel(210, 12, 540, 62);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui,sans-serif';
  ctx.fillText('Reach the Fort before sunset. The cats are behind you.', 480, 36);
  ctx.font = '13px system-ui,sans-serif'; ctx.fillStyle = '#ddd';
  ctx.fillText('Move: arrow keys / WASD, or hold mouse / finger. Your first move starts the run.', 480, 58);
}
function resultTitle() {
  if (res === 'won') return 'You reached the Fort!';
  if (res === 'trapped') return 'TRAP: ' + cur.trap;
  if (res === 'caught') return 'The cats caught you';
  return 'The sun set';
}
function forkText(i) {
  const f = cur.f[i];
  return f ? f + (f === FORKS[i].safe ? ' (safe)' : ' (trap)') : '-';
}
function drawOver() {
  panel(150, 110, 660, 320);
  ctx.textAlign = 'center';
  ctx.fillStyle = res === 'won' ? '#ffd679' : '#ff8a70'; ctx.font = 'bold 28px system-ui,sans-serif';
  ctx.fillText(resultTitle(), 480, 156);
  ctx.fillStyle = '#fff'; ctx.font = '15px system-ui,sans-serif';
  ctx.fillText('Attempt ' + cur.n + '  |  ' + cur.t.toFixed(1) + ' s  |  Fork 1: ' + forkText(0) + '  |  Fork 2: ' + forkText(1), 480, 190);
  ctx.textAlign = 'left'; ctx.font = '13px ui-monospace,Menlo,Consolas,monospace'; ctx.fillStyle = '#cfc8c0';
  const rows = attempts.slice(-6);
  ctx.fillText('History (newest last)', 190, 226);
  rows.forEach((a, i) => {
    const f1 = a.f[0] ? a.f[0] + (a.f[0] === FORKS[0].safe ? ' ok' : ' TRAP') : '-';
    const f2 = a.f[1] ? a.f[1] + (a.f[1] === FORKS[1].safe ? ' ok' : ' TRAP') : '-';
    ctx.fillText('#' + a.n + '  F1: ' + f1.padEnd(10) + ' F2: ' + f2.padEnd(10) + ' ' + a.res + (a.trap ? ' (' + a.trap + ')' : ''), 190, 248 + i * 20);
  });
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui,sans-serif';
  ctx.fillText('Press R / Space, or tap, to try again', 480, 414);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake * 2.5, (Math.random() - 0.5) * 10 * shake * 2.5);
  drawWorld();
  drawCatBodies();
  drawPlayer();
  drawDusk();
  drawGate();
  drawCatEyes();
  ctx.restore();
  drawHud();
  if (state === 'ready') drawReady();
  if (state === 'over') drawOver();
}

// ---------- loop ----------
window.__proto = { get state() { return state; }, get res() { return res; }, get t() { return t; }, attempts, reset, get gap() { return ds[ds.length - 1] - sc; }, get pos() { return [px, py]; } };
reset();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
