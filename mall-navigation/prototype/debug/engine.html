<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Engine Debug</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0f12;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #map {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 8px;
        bottom: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(11, 15, 20, 0.78);
        color: #f5f7fa;
        font: 12px/16px ui-monospace, monospace;
        pointer-events: none;
        white-space: pre;
      }
      #hud[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="hud" hidden></div>
    <script type="module" src="./engine-debug.js"></script>
  </body>
</html>
