<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5B2A4D" />
    <meta name="description" content="Care &amp; Us — hair, nails and beard in one salon system, with the Agreement Card" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Care &amp; Us" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Care &amp; Us</title>
    <script>
      // GitHub Pages deep links: the site 404 page sends /<base>/some/route to /<base>/?__p=some/route.
      // Restore the real URL before the router starts (no effect on Firebase Hosting, which rewrites to index.html).
      (function () {
        var m = location.search.match(/[?&]__p=([^&]*)/);
        if (m) history.replaceState(null, '', location.pathname.replace(/\/?$/, '/') + decodeURIComponent(m[1]) + location.hash);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Care &amp; Us needs JavaScript. يحتاج كير آند أس إلى تفعيل JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
