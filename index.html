<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F3EE" />
    <meta name="description" content="Try nail polish colors on your real hand before your appointment. جرّبي ألوان الأظافر على يدك قبل موعدك." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Nail Mirror</title>
    <script>
      // GitHub Pages deep links: the site 404 page redirects /<base>/some/route to /<base>/?__p=some/route.
      // Restore the real URL before the router starts (no effect on Firebase Hosting, which rewrites to index.html).
      ;(function () {
        var m = location.search.match(/[?&]__p=([^&]*)/)
        if (m) history.replaceState(null, '', location.pathname.replace(/\/?$/, '/') + decodeURIComponent(m[1]) + location.hash)
      })()
    </script>
  </head>
  <body class="bg-porcelain text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
